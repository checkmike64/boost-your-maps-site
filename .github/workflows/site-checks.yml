name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate static site
        run: python3 scripts/validate_site.py
      - name: Check lead form routing (BYM CRM)
        run: node scripts/check_crm_payload.js
      - name: Check signup and partner portal functions (BYM CRM)
        run: node scripts/check_signup_payload.js
      - name: Check agreement functions (BYM CRM)
        run: node scripts/check_agreement_payload.js
      - name: Check first-touch attribution and the purchase event
        run: node scripts/check_tracking.js
      - name: Check the review link tool (parsing, QR code, places route)
        run: node scripts/check_review_link.js
      - name: Check the Agency Partners email function and page
        run: node scripts/check_partner_access.js
      - name: Check "Run a report" and the portal page
        run: node scripts/check_partner_report.js
      - name: Check the footer link, the agency list and the signup page
        run: node scripts/check_footer.js
      - name: Check the Content-Security-Policy
        run: node scripts/check_csp.js
